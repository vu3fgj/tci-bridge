name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtwebsockets
          cache: true

      - name: Install yaml-cpp
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install yaml-cpp:x64-windows

      - name: Configure
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR\.."

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Deploy Qt DLLs
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter "tci-bridge.exe" -Recurse |
                 Select-Object -First 1 -ExpandProperty FullName

          if (-not $exe) {
            Write-Error "tci-bridge.exe was not found"
            exit 1
          }

          $dist = "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null

          Copy-Item $exe "$dist\tci-bridge.exe"

          & windeployqt `
            --release `
            --compiler-runtime `
            --no-translations `
            "$dist\tci-bridge.exe"

          Copy-Item "examples\tci-bridge.yml" "$dist\tci-bridge.yml"

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\*" `
            -DestinationPath "tci-bridge-windows-x64.zip" `
            -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: tci-bridge-windows-x64
          path: tci-bridge-windows-x64.zip
